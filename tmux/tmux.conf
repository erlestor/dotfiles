# ---------- OPTIONS ----------
# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g display-time 1000

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]"
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# ---------- BINDINGS ----------
# Prefix
set -g prefix C-a
bind C-a send-prefix

# Copy mode
setw -g mode-keys vi
bind y copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Panes
bind x kill-pane
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind -n C-M-S-Left  resize-pane -L 5
bind -n C-M-S-Down  resize-pane -D 5
bind -n C-M-S-Up    resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Windows
bind x kill-window
bind n select-window -t +1
bind p select-window -t -1
bind r command-prompt "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind u swap-window -t -1 \; select-window -t -1
bind i swap-window -t +1 \; select-window -t +1

# Sessions
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind [ switch-client -p   # prev session (freed P for other use)
bind N switch-client -n   # next session
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n
bind j run-shell "sesh connect Config 🔨"
bind k run-shell "sesh connect Deploii 💻️"

# Kill tmux. If I want to game and save resources
bind X run-shell "tmux kill-server"

# ---------- PLUGINS ----------
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Smart splits
set -g @plugin 'mrjones2014/smart-splits.nvim'

# ctrl+shift+alt+hjkl resize
set -g extended-keys on
set -ga terminal-features "*:extkeys"

set -g @smart-splits_resize_left_key  'C-S-A-h'
set -g @smart-splits_resize_down_key  'C-S-A-j'
set -g @smart-splits_resize_up_key    'C-S-A-k'
set -g @smart-splits_resize_right_key 'C-S-A-l'
set -g @smart-splits_resize_step_size '3' # change the step-size for resizing.

# Sesh (sesh-bin aur)
bind -n C-f run-shell "sesh connect \"$(
  sesh list --icons --hide-duplicates | fzf-tmux -p 20%,40% \
    --no-sort --ansi \
    --prompt '   \n' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --reverse \
    --style 'default' \
    --no-info \
    --pointer '' \
    # --border-label ' workspaces ' \
    # --footer '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    # --preview-window 'right:55%' \
    # --preview 'sesh preview {}'
)\""
bind-key "K" display-popup -h 40% -w 40% -E "sesh picker -i"

# Resurrect & continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Theme
# set -g @plugin "janoamaral/tokyo-night-tmux"

# Auto reload. Keep at bottom. but I guess over the tpm one?
set-option -g @plugin 'b0o/tmux-autoreload'
set -g @continuum-restore 'on'

# Keep this at the bottom to load plugin manager
run '~/.tmux/plugins/tpm/tpm'
