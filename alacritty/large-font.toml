general.import = ["~/.config/omarchy/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[terminal.shell]
program = "/bin/bash"
args = ["-c", "tmux new-session -A -s default"]

[font]
normal = { family = "JetBrainsMono Nerd Font" }
bold = { family = "JetBrainsMono Nerd Font" }
italic = { family = "JetBrainsMono Nerd Font" }
size = 12

[window]
padding.x = 10
padding.y = 0
dynamic_padding = true
decorations = "None"

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  # Smart splits. Alacritty doesnt send ctrl+shift+alt+hjkl to tmux
  # error about invalid excape sequence seems wrong. because it works
  { key = "H", mods = "Control|Shift|Alt", chars = "\x1b[104;8u" },
  { key = "J", mods = "Control|Shift|Alt", chars = "\x1b[106;8u" },
  { key = "K", mods = "Control|Shift|Alt", chars = "\x1b[107;8u" },
  { key = "L", mods = "Control|Shift|Alt", chars = "\x1b[108;8u" },
]
